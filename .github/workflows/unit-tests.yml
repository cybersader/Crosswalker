name: Unit Tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is pinned deliberately. `bun run test` invokes the jest shim, whose
      # shebang is `#!/usr/bin/env node`, so tests actually execute under Node,
      # not Bun. The Tier 2 closure tests import `node:sqlite`, which requires
      # Node >= 22.5 and does NOT exist under Bun. Without this step the job
      # inherits whatever Node the runner image happens to ship, so the suite
      # would pass locally and fail whenever that default is older.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build plugin
        run: bun run build

      - name: Run tests
        run: bun run test
